<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HistFig</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%238a5a2b'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Georgia,serif'>H</text></svg>">
  <script>
    /* Day / night colours, applied before the page is drawn (so it never flashes).
       The choice ("auto", "light" or "dark") is kept in this browser; "auto" follows the system. */
    window.applyTheme = function () {
      var choice = "auto";
      try { choice = JSON.parse(localStorage.getItem("histfig.theme")) || "auto"; } catch (e) {}
      var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      return choice;
    };
    applyTheme();
  </script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">HistFig</a>
    <nav>
      <a href="#/" data-nav="figures">Figures</a>
      <a href="#/chat" data-nav="chat" hidden>Chat</a>
      <a href="#/settings" data-nav="settings" class="admin-only">Settings</a>
    </nav>
    <button type="button" class="theme-toggle" id="theme-toggle"></button>
  </header>
  <main id="app"></main>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
