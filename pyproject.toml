[project]
name = "histfig"
version = "0.1.0"
description = "Chat with historical figures grounded in their own writings — runs locally."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "numpy>=1.26",
    "jieba>=0.42.1",
    "snowballstemmer>=2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "charset-normalizer>=3.3",
]

[project.optional-dependencies]
# In-process embeddings without any server. Pulls in torch (~2 GB).
local = ["sentence-transformers>=3.0"]

[project.scripts]
histfig = "histfig.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/histfig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
